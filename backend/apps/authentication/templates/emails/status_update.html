<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Application status update</title></head>
<body style="font-family:Arial,sans-serif;line-height:1.6;color:#1f2937;background:#f1f5f9;padding:24px">
  <div style="max-width:600px;margin:auto;background:#fff;border-radius:12px;overflow:hidden">
    <div style="background:#0284c7;color:#fff;padding:24px;text-align:center"><h1>Application update</h1></div>
    <div style="padding:28px">
      <p>Hi {{ candidate_name }},</p>
      <p>Your application for <strong>{{ job_title }}</strong> has been updated.</p>
      <div style="border-left:4px solid #0284c7;background:#f8fafc;padding:16px;margin:20px 0"><strong>{{ status_label }}</strong></div>
      <p style="text-align:center"><a href="{{ application_url }}" style="background:#0284c7;color:#fff;padding:12px 24px;border-radius:8px;text-decoration:none">View my applications</a></p>
    </div>
  </div>
</body>
</html>
